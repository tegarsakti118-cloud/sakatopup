name: Build SakaPay Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build SakaPay Admin APK
        run: |
          gradle -p android-wrapper assembleDebug --no-daemon
          cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk SakaPay-Admin.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SakaPay-Admin-APK
          path: SakaPay-Admin.apk
          retention-days: 30
